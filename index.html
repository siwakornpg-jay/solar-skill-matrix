<script>
// ======================= ⚙️ CONFIG =======================
// เว้นว่างไว้ = โหมดสาธิต (เก็บข้อมูลในเบราว์เซอร์)
// ใส่ค่าจาก Supabase → Project Settings → API เพื่อเก็บข้อมูลบนคลาวด์
const SUPABASE_URL = '';
const SUPABASE_ANON_KEY = '';
// =========================================================

const USE_SB = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
const sb = USE_SB ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2));
const today = () => new Date().toISOString().slice(0, 10);
const thDate = d => new Date(d).toLocaleDateString('th-TH', { dateStyle: 'medium' });
const thDT = d => new Date(d).toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' });
const sortDesc = a => a.sort((x, y) => (y.created_at || '').localeCompare(x.created_at || ''));
const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const icons = () => window.lucide && lucide.createIcons();
const loading = () => `<div class="p-8 text-muted">กำลังโหลด...</div>`;
const safe = fn => async (...a) => { try { return await fn(...a); } catch (e) { console.error(e); toast('เกิดข้อผิดพลาด: ' + (e.message || e), true); } };

function toast(msg, err) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = `fixed left-1/2 top-4 z-50 -translate-x-1/2 rounded-lg px-4 py-2 text-sm text-white shadow-lg ${err ? 'bg-red-600' : 'bg-green-600'}`;
  clearTimeout(t._h); t._h = setTimeout(() => (t.className = 'hidden'), 2800);
}

function avatar(src, name, size = 48) {
  const st = `width:${size}px;height:${size}px`;
  return src
    ? `<img src="${esc(src)}" alt="" style="${st}" class="shrink-0 rounded-full object-cover ring-2 ring-brand/50">`

}

const modeBadge = () => USE_SB

/* ---------- Data layer (Supabase หรือ localStorage) ---------- */
const LS_KEY = 'solar_skill_matrix_v1';
const local = {
  load() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch { return {}; } },
  save(d) { try { localStorage.setItem(LS_KEY, JSON.stringify(d)); } catch { throw new Error('พื้นที่เก็บข้อมูลในเบราว์เซอร์เต็ม'); } }
};
const isMatch = (r, m) => Object.entries(m).every(([k, v]) => r[k] === v);

const DB = {
  async all(t, m = {}) {
    if (USE_SB) {
      let out = [], from = 0;
      while (true) {
        const { data, error } = await sb.from(t).select('*').match(m).range(from, from + 999);
        if (error) throw error;
        out = out.concat(data);
        if (data.length < 1000) break;
        from += 1000;
      }
      return out;
    }
    return (local.load()[t] || []).filter(r => isMatch(r, m));
  },
  async insert(t, rows) {
    rows = Array.isArray(rows) ? rows : [rows];
    if (!rows.length) return [];
    if (USE_SB) {
      const { data, error } = await sb.from(t).insert(rows).select();
      if (error) throw error; return data;
    }
    const d = local.load(), now = new Date().toISOString();
    const out = rows.map(r => ({ id: uid(), created_at: now, ...r }));
    d[t] = [...(d[t] || []), ...out]; local.save(d); return out;
  },
  async update(t, m, patch) {
    if (USE_SB) { const { error } = await sb.from(t).update(patch).match(m); if (error) throw error; return; }
    const d = local.load(); d[t] = (d[t] || []).map(r => (isMatch(r, m) ? { ...r, ...patch } : r)); local.save(d);
  },
  async del(t, m) {
    if (USE_SB) { const { error } = await sb.from(t).delete().match(m); if (error) throw error; return; }
    const d = local.load(); d[t] = (d[t] || []).filter(r => !isMatch(r, m)); local.save(d);
  },
  async upsertES(rows) {
    if (USE_SB) { const { error } = await sb.from('employee_skills').upsert(rows, { onConflict: 'employee_id,skill_id' }); if (error) throw error; return; }
    const d = local.load(); d.employee_skills = d.employee_skills || [];
    rows.forEach(r => {
      const i = d.employee_skills.findIndex(x => x.employee_id === r.employee_id && x.skill_id === r.skill_id);
      if (i >= 0) d.employee_skills[i] = { ...d.employee_skills[i], ...r }; else d.employee_skills.push(r);
    });
    local.save(d);
  }
};

async function deleteEmployees(ids) {
  for (const id of ids) {
    for (const t of ['employee_skills', 'tasks', 'activities']) await DB.del(t, { employee_id: id });
    await DB.del('employees', { id });
  }
}
async function getSkills(activeOnly = true) {
  let s = await DB.all('skills');
  if (activeOnly) s = s.filter(x => x.is_active !== false);
  return s.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
}

async function restoreDefaultSkills() {
  const names = new Set((await DB.all('skills')).map(s => s.name));
  const add = DEFAULT_SKILLS.filter(s => !names.has(s.name)).map(s => ({ ...s, is_active: true }));
  await DB.insert('skills', add);
  return (await getSkills()).length;
}

async function generateMockData(count) {
  let skills = await getSkills();
  if (!skills.length) { await restoreDefaultSkills(); skills = await getSkills(); }
  const stamp = Date.now().toString().slice(-5);
  const rows = Array.from({ length: count }, (_, i) => {
    const female = Math.random() < 0.2;
    const lvl = pick([0, 1, 1, 1, 2, 2, 3, 4]);
    const start = new Date(); start.setMonth(start.getMonth() - rand(3, 12 * (lvl + 1)));
    return {
      employee_code: `SLR-${stamp}-${String(i + 1).padStart(2, '0')}`,
      first_name: female ? pick(FIRST_F) : pick(FIRST_M), last_name: pick(LAST), nickname: pick(NICK),
      position: CAREER[lvl], team: pick(TEAMS), team_lead: pick(LEADS),
      phone: `08${rand(1, 9)}-${rand(100, 999)}-${rand(1000, 9999)}`,
      email: `tech${stamp}${i + 1}@solar-demo.co.th`,
      start_date: start.toISOString().slice(0, 10),
      photo_url: `https://randomuser.me/api/portraits/${female ? 'women' : 'men'}/${rand(1, 90)}.jpg`,
      is_mock: true
    };
  });
  const emps = await DB.insert('employees', rows);
  const es = [], tasks = [], acts = [];
  for (const e of emps) {
    const s = CAREER.indexOf(e.position);
    for (const sk of skills) {
      let base = 1 + s + rand(-1, 1);
      if (sk.category === 'soft' && s >= 3) base += 1;
      if (sk.short_name === 'BESS' && e.team !== 'ทีม BESS & Hybrid') base -= 1;
      const cur = clamp(base, 0, 5), tgt = clamp(cur + rand(0, 2), cur, 5);
      es.push({ employee_id: e.id, skill_id: sk.id, current_level: cur, target_level: tgt, certified: cur >= 3 && Math.random() > 0.4 });
    }
    [...TASK_TPL].sort(() => Math.random() - 0.5).slice(0, rand(2, 4))
      .forEach(t => tasks.push({ ...t, employee_id: e.id, status: pick(ST_ORDER), due_date: today() }));
    acts.push(
      { employee_id: e.id, actor: 'System', action: `เพิ่มพนักงานใหม่ ${e.first_name} ${e.last_name} (Mock)` },
      { employee_id: e.id, actor: e.team_lead, action: 'ประเมินทักษะประจำไตรมาสเรียบร้อย' }
    );
  }
  await DB.insert('employee_skills', es);
  await DB.insert('tasks', tasks);
  await DB.insert('activities', acts);
  return emps.length;
}

async function clearMockData() {
  const m = await DB.all('employees', { is_mock: true });
  await deleteEmployees(m.map(e => e.id));
  return m.length;
}

function renderNav(path) {
  const act = h => (h === '/' ? path === '/' || path.startsWith('/emp') : path.startsWith(h));
  $('#sideNav').innerHTML = NAV.map(([h, ic, l]) => `<a href="#${h}" title="${l}" class="grid h-11 w-11 place-items-center rounded-xl transition ${act(h) ? 'bg-brand/15 text-brand ring-1 ring-brand/40' : 'text-muted hover:bg-white/5 hover:text-white'}"><i data-lucide="${ic}" class="h-5 w-5"></i></a>`).join('');
  $('#bottomNav').innerHTML = NAV.map(([h, ic, l]) => `<a href="#${h}" class="flex flex-1 flex-col items-center gap-0.5 py-2 text-[11px] ${act(h) ? 'text-brand' : 'text-muted'}"><i data-lucide="${ic}" class="h-5 w-5"></i>${l}</a>`).join('');
}

async function router() {
  const path = location.hash.slice(1) || '/';
  const p = path.split('/').filter(Boolean);
  renderNav(path);
  window.scrollTo(0, 0);
  try {
    if (!p.length) await viewHome();
    else if (p[0] === 'emp' && p[1] === 'new') await viewForm();
    else if (p[0] === 'emp' && p[2] === 'edit') await viewForm(p[1]);
    else if (p[0] === 'emp') await viewEmployee(p[1]);
    else if (p[0] === 'matrix') await viewMatrix();
    else if (p[0] === 'skills') await viewSkills();
    else if (p[0] === 'mock') viewMock();
    else location.hash = '#/';
  } catch (e) {
    console.error(e);

    if (r.certified) a.cert++;
  });
  H.emps = sortDesc(emps);
  H.stats = Object.fromEntries(Object.entries(acc).map(([k, a]) => [k, { avg: a.n ? a.sum / a.n : 0, gap: a.gap, cert: a.cert }]));

function renderCareer() {
  const pos = E.emp.position, next = nextPos(pos);
  const tgt = E.rows.reduce((s, r) => s + r.target_level, 0);
  const cur = E.rows.reduce((s, r) => s + Math.min(r.current_level, r.target_level), 0);
  const pct = tgt ? cur / tgt : 0, SEG = 8;
  $('#cp').innerHTML = `
  <section class="panel p-5">
    <div class="mb-4 flex items-center justify-between"><h2 class="text-lg font-medium">เส้นทางอาชีพ</h2>
      <span class="rounded-lg border border-sky-400/40 px-3 py-1 text-xs text-sky-300">${Math.round(pct * 100)}% ของเป้าหมาย</span></div>

    <div class="mb-3 flex justify-between gap-4 text-sm font-medium"><span>${esc(pos)}</span><span class="text-right">${esc(next)}</span></div>
    <div class="flex gap-1.5">${Array.from({ length: SEG }, (_, i) => `<div class="h-2 flex-1 overflow-hidden rounded-full bg-zinc-700"><div class="h-full bg-skill transition-all" style="width:${Math.min(1, Math.max(0, pct * SEG - i)) * 100}%"></div></div>`).join('')}</div>
  </section>`;
}

const RTABS = [['hard', CAT.hard], ['safety', CAT.safety], ['soft', CAT.soft], ['all', 'ทั้งหมด']];
function drawRadar() {
  $('#rTabs').innerHTML = RTABS.map(([k, l]) => `<button onclick="E.rTab='${k}';drawRadar()" class="tab ${E.rTab === k ? 'tab-active' : ''}">${l}</button>`).join('');
  const d = E.rows.filter(r => E.rTab === 'all' || r.category === E.rTab);
  const cv = $('#radar'), msg = $('#rMsg');
  if (d.length < 3) { msg.style.display = 'grid'; cv.style.display = 'none'; return; }
  msg.style.display = 'none'; cv.style.display = 'block';
  const labels = d.map(r => r.short_name), cur = d.map(r => r.current_level), tgt = d.map(r => r.target_level);
  if (radarChart && radarChart.canvas === cv) {
    radarChart.data.labels = labels; radarChart.data.datasets[0].data = cur; radarChart.data.datasets[1].data = tgt;
    radarChart.update(); return;
  }
  if (radarChart) radarChart.destroy();
  radarChart = new Chart(cv, {
    type: 'radar',
    data: { labels, datasets: [
      { label: 'ปัจจุบัน', data: cur, backgroundColor: 'rgba(134,239,172,.85)', borderColor: '#86efac', pointBackgroundColor: '#86efac', pointRadius: 2, borderWidth: 1 },
      { label: 'เป้าหมาย', data: tgt, backgroundColor: 'rgba(63,107,74,.75)', borderColor: '#4d7c5a', pointRadius: 0, borderWidth: 1 }
    ] },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: { r: { min: 0, max: 5,
        ticks: { stepSize: 1, color: '#6b7280', backdropColor: 'transparent', font: { size: 10 } },
        grid: { color: '#3a3c43' }, angleLines: { color: '#3a3c43' },
        pointLabels: { color: '#d1d5db', font: { size: 11, family: 'Prompt' } } } },
      plugins: {
        legend: { position: 'bottom', labels: { color: '#d1d5db', font: { family: 'Prompt', size: 12 }, boxWidth: 14 } },
        tooltip: { backgroundColor: '#26272d', borderColor: '#2f3138', borderWidth: 1, titleFont: { family: 'Prompt' }, bodyFont: { family: 'Prompt' } }
      }
    }
  });
}

function lvPicker(r, field, tone) {
  const val = r[field];
  return `<div class="flex items-center gap-2"><span class="w-14 text-[11px] text-muted">${tone === 'cur' ? 'ปัจจุบัน' : 'เป้าหมาย'}</span><div class="flex gap-1">
    ${[1, 2, 3, 4, 5].map(v => `<button type="button" title="${LEVELS[v].label}" onclick="setLv('${r.skill_id}','${field}',${v})"
      class="h-7 w-7 rounded-md text-[11px] font-medium transition sm:h-6 sm:w-6 ${v <= val ? (tone === 'cur' ? 'bg-skill text-black' : 'bg-target text-green-100') : 'bg-zinc-800 text-zinc-500 hover:bg-zinc-700'}">${v}</button>`).join('')}
  </div></div>`;
}
function renderEditor() {

function setLv(sid, field, v) {
  const r = E.rows.find(x => x.skill_id === sid);
  saveSkill(sid, { [field]: r[field] === v ? v - 1 : v });
}
const saveSkill = safe(async (sid, patch) => {
  const r = E.rows.find(x => x.skill_id === sid);
  const old = { ...r };
  Object.assign(r, patch);
  renderProfile(); renderCareer(); drawRadar(); renderEditor();
  await DB.upsertES([{ employee_id: E.id, skill_id: sid, current_level: r.current_level, target_level: r.target_level, certified: r.certified, updated_at: new Date().toISOString() }]);
  if ('certified' in patch) await logAct(E.id, `${r.certified ? 'เพิ่ม' : 'ยกเลิก'}ใบรับรอง "${r.name}"`);
  else await logAct(E.id, `ปรับทักษะ "${r.name}" จาก L${old.current_level} เป็น L${r.current_level} (เป้าหมาย L${r.target_level})`);
  await reloadActs();
});

function renderTasks() {

            <button onclick="deleteTask('${t.id}')" title="ลบงาน" class="text-zinc-500 hover:text-red-400"><i data-lucide="x" class="h-3.5 w-3.5"></i></button></div></div>
        ${t.description ? `<p class="mt-1 text-sm text-gray-300">${esc(t.description)}</p>` : ''}
        ${(t.tags || []).length ? `<div class="mt-3 flex flex-wrap gap-1.5">${t.tags.map(g => `<span class="chip-green">${esc(g)}</span>`).join('')}</div>` : ''}

    </div>

const reloadTasks = async () => { E.tasks = sortDesc(await DB.all('tasks', { employee_id: E.id })); renderTasks(); };
const reloadActs = async () => { E.acts = sortDesc(await DB.all('activities', { employee_id: E.id })); renderActs(); };
const addTask = safe(async () => {
  const t = $('#taskIn').value.trim(); if (!t) return;
  await DB.insert('tasks', { employee_id: E.id, title: t, description: null, status: 'todo', tags: [], due_date: today() });
  await logAct(E.id, `เพิ่มงาน "${t}"`);
  await reloadTasks(); await reloadActs();
});
const cycleTask = safe(async id => {
  const t = E.tasks.find(x => x.id === id);
  const next = ST_ORDER[(ST_ORDER.indexOf(t.status) + 1) % ST_ORDER.length];
  await DB.update('tasks', { id }, { status: next });
  await logAct(E.id, `เปลี่ยนสถานะงาน "${t.title}" เป็น ${STATUS[next].label}`);
  await reloadTasks(); await reloadActs();
});
const deleteTask = safe(async id => {
  if (!confirm('ลบงานนี้?')) return;
  await DB.del('tasks', { id }); await reloadTasks();
});

function renderActs() {

function resizeImage(file, max = 320) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => rej(new Error('อ่านไฟล์รูปไม่ได้'));
    img.src = URL.createObjectURL(file);
  });
}
const pickPhoto = safe(async input => {

let mockBusy = false, mockLogged = false;
async function mockRun(kind) {
  if (mockBusy) return;
  if (kind === 'clear' && !confirm('ลบข้อมูล mock ทั้งหมด?')) return;
  if (kind === 'reset' && !confirm('ลบข้อมูลทั้งหมดในเบราว์เซอร์นี้ (รวมข้อมูลที่กรอกเอง)?')) return;
  const btns = document.querySelectorAll('#app button');
  const log = m => { const el = $('#mlog'); if (!mockLogged) { el.innerHTML = ''; mockLogged = true; } el.insertAdjacentHTML('afterbegin', `<div>${new Date().toLocaleTimeString('th-TH')}  ${esc(m)}</div>`); };
  mockBusy = true; btns.forEach(b => (b.disabled = true));
  try {
    if (kind === 'gen') { log('กำลังสร้าง...'); log(`✅ สร้างพนักงาน mock ${await generateMockData(+$('#mc').value)} คน`); }
    if (kind === 'skills') log(`✅ มีทักษะพร้อมใช้ ${await restoreDefaultSkills()} รายการ`);
    if (kind === 'clear') log(`🗑️ ลบพนักงาน mock ${await clearMockData()} คน`);
    if (kind === 'reset') { localStorage.removeItem(LS_KEY); await restoreDefaultSkills(); log('🗑️ รีเซ็ตข้อมูลทั้งหมดแล้ว (คืนค่าทักษะมาตรฐาน)'); }
  } catch (e) { log('❌ ' + (e.message || e)); }
  finally { mockBusy = false; btns.forEach(b => (b.disabled = false)); }
}
